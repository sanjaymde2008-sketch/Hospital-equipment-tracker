<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hospital Equipment Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f6f5;--card:#fff;--ink:#12302e;--mute:#5d7573;--line:#d9e4e2;--brand:#0f6b66;--ok:#1b8a5a;--okbg:#dcf3e8;--use:#a85f00;--usebg:#fdebcf;--bad:#c4372f;--badbg:#fbdedb;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1a19;--card:#142625;--ink:#e3f1ef;--mute:#8fb0ac;--line:#243d3b;--brand:#4cc2b8;--ok:#4fd08e;--okbg:#14382a;--use:#f0a840;--usebg:#3d2c10;--bad:#ff7d73;--badbg:#431c19;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1a19;--card:#142625;--ink:#e3f1ef;--mute:#8fb0ac;--line:#243d3b;--brand:#4cc2b8;--ok:#4fd08e;--okbg:#14382a;--use:#f0a840;--usebg:#3d2c10;--bad:#ff7d73;--badbg:#431c19;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Public Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Schibsted Grotesk","Public Sans",system-ui,sans-serif;margin:0}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;padding:12px 20px}
header h1{font-size:19px;font-weight:700;color:var(--brand);margin-right:auto}
header input{width:min(260px,100%);padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.clock{font-weight:600;font-variant-numeric:tabular-nums;min-width:74px;text-align:right}
button{font:inherit;color:inherit;cursor:pointer}
.theme{border:1px solid var(--line);background:none;border-radius:8px;padding:6px 10px}
nav{display:flex;gap:4px;padding:0 20px;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px;font-weight:500;color:var(--mute);white-space:nowrap}
nav button[aria-selected="true"]{color:var(--brand);border-color:var(--brand);font-weight:600}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
main{max-width:1180px;margin:0 auto;padding:20px}
section[hidden]{display:none}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:18px}
.panel h2{font-size:17px;margin-bottom:12px}
.types th,.types td{padding:10px 12px}
.types tr.row{cursor:pointer}
.types tr.row:hover td,.types tr.row.on td{background:var(--bg)}
.num{font:700 20px/1 "Schibsted Grotesk",sans-serif;font-variant-numeric:tabular-nums}
.n-ok{color:var(--ok)}.n-bad{color:var(--bad)}
.types small{color:var(--mute);margin-left:8px;font-size:12px}
.hint{color:var(--mute);font-size:13px;margin:-6px 0 8px}
.mini{display:flex;height:8px;min-width:90px;border-radius:4px;overflow:hidden;background:var(--line)}
.mini i{display:block;transition:width .5s}
.mapbox{border-radius:10px}
.mapin{position:relative}
.mapin svg{display:block;width:100%;height:auto;background:#0e3d6e;border-radius:10px;user-select:none;-webkit-user-select:none}
.gap{stroke:#0e3d6e;stroke-width:6}
.door{fill:none;stroke:#cfeaff;stroke-width:1.2}
.bpt{font:500 9px "Public Sans",sans-serif;fill:#9fcdf5}
.zoom{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px;z-index:4}
.zoom button{width:36px;height:36px;border-radius:8px;border:1px solid #6fb3ee;background:rgba(8,42,77,.92);color:#eaf5ff;font-size:20px;line-height:1;padding:0}
.zoom button:hover:not(:disabled){background:#12508f}
.zoom button:disabled{opacity:.4;cursor:default}
